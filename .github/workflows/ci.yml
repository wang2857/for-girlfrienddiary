name: CI

on:
  push:
    branches: [ main, beautify ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 自带 Android SDK 与 cmdline-tools，用不着 setup-android：
      # 那个 action 会去装已经被废弃的 `tools` 包，装不上就直接 fail（2026-11 实测）。
      - name: 安装 SDK 平台
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: 单元测试
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint（有 Error 就让构建失败）
        run: ./gradlew --no-daemon :app:lintDebug

      - name: 编译仪器测试（arm64 应用跑不了 x86_64 模拟器，这里只编译）
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: 构建调试包 + 64 位自检
        run: ./gradlew --no-daemon :app:check64Bit

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
